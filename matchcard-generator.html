<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Card Generator - 2UHub</title>
  <meta name="description" content="Free wrestling match card maker. Build show cards with your own rosters or type your own names, add made-up titles, name your show, and download the graphic.">
  <meta name="theme-color" content="#0a0a14">
  <meta name="keywords" content="Universe Mode, match card generator, wrestling card maker, wrestling booking, 2UHub">
  <link rel="canonical" href="https://2uhub.com/matchcard-generator">
  <meta property="og:title" content="Match Card Generator - 2UHub">
  <meta property="og:description" content="Create wrestling match cards, name your show, add matches and titles, and export the graphic.">
  <meta property="og:image" content="https://2uhub.com/logos/2uhub-social-preview-1200x630.png">
  <meta property="og:url" content="https://2uhub.com/matchcard-generator">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="2UHub">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Match Card Generator - 2UHub">
  <meta name="twitter:description" content="Free wrestling match card generator. Build and download show cards for your Universe Mode booking.">
  <meta name="twitter:image" content="https://2uhub.com/logos/2uhub-social-preview-1200x630.png">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="hardcore.css">
  <link rel="stylesheet" href="matchcard.css">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "2UHub Match Card Generator",
    "applicationCategory": "GameApplication",
    "operatingSystem": "Web Browser",
    "description": "Free wrestling match card generator. Create show cards, name your show, add matches and download graphics for fantasy booking.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "url": "https://2uhub.com/matchcard-generator"
  }
  </script>
</head>
<body class="hc mc-page">

  <header class="hc-header" role="banner">
    <a href="index.html" class="hc-logo" aria-label="2UHub home"><img src="images/px/logo.png" alt="2UHub – Match Card Generator logo"></a>
    <h1 class="page-title">Match Card Maker</h1>
    <div class="hc-header-actions">
      <a class="btn btn-steel btn-sm" href="tools.html">Draft</a>
      <a class="btn btn-support btn-sm hide-sm" href="https://buymeacoffee.com/2khub" target="_blank" rel="noopener">Support</a>
    </div>
  </header>

  <div class="mc-layout">

    <!-- ROSTER / TAG TEAMS -->
    <aside class="mc-side panel" id="mc-side" aria-label="Roster">
      <div class="side-top">
        <div class="seg side-tabs" id="side-tabs">
          <button type="button" data-act="tab" data-v="stars" class="on">Superstars</button>
          <button type="button" data-act="tab" data-v="teams">Tag teams <i id="team-count"></i></button>
        </div>
        <button type="button" class="sheet-done btn btn-primary btn-sm" data-act="sheet-close">Done</button>
      </div>

      <div id="side-stars" class="side-pane">
        <div class="side-filters">
          <div class="mode-grid">
            <button type="button" class="game-tile" id="mode-roster" data-act="mode-roster"><span>Browse a roster</span></button>
            <button type="button" class="game-tile" id="mode-free" data-act="mode-free"><span>Free mode</span></button>
          </div>
          <select id="pool-select" class="hc-select" aria-label="Roster source" hidden></select>
          <div class="seg" id="sex-seg" hidden>
            <button type="button" data-act="f-sex" data-v="all" class="on">All</button>
            <button type="button" data-act="f-sex" data-v="man">Men</button>
            <button type="button" data-act="f-sex" data-v="woman">Women</button>
          </div>
        </div>
        <div class="side-count" id="roster-count"></div>
        <div id="roster-list" class="side-list" role="list"></div>
      </div>

      <div id="side-teams" class="side-pane" hidden>
        <div class="side-filters">
          <button type="button" class="btn btn-primary" data-act="team-new">+ Create tag team</button>
          <p class="fine-print">Click a team to drop both partners into the next open tag slot, or drag it onto a team.</p>
        </div>
        <div id="team-list" class="side-list"></div>
      </div>
    </aside>

    <!-- THE CARD -->
    <main class="mc-main">
      <div class="card-bar">
        <div class="card-title">
          <h2>Fight card</h2>
          <p id="card-hint"></p>
        </div>
        <div class="card-show">
          <label class="lbl" for="show-name">Show name</label>
          <div class="show-form">
            <input id="show-name" class="field" maxlength="28" placeholder="e.g. Monday Night Mayhem" autocomplete="off">
            <input id="show-color" class="show-color" type="color" value="#e0202c" aria-label="Show color" title="Show color">
          </div>
        </div>
      </div>

      <div id="events" class="events"></div>
      <div class="add-row"><button type="button" class="btn btn-steel" data-act="add-match">+ Add match</button></div>
    </main>
  </div>

  <footer class="prompts" role="contentinfo">
    <button type="button" class="btn btn-steel btn-sm" data-act="add-match">+ Add match</button>
    <button type="button" class="btn btn-steel btn-sm mc-only-mobile" data-act="sheet-open">+ Superstars</button>
    <button type="button" class="btn btn-steel btn-sm" data-act="clear-card">Clear card</button>
    <span class="gap"></span>
    <button type="button" class="btn btn-primary" id="download" data-act="download">Download match card</button>
  </footer>

  <div id="mc-export-board" class="mcx-board" aria-hidden="true"></div>

  <script src="hardcore.js"></script>
  <script src="tagteams.js"></script>
  <script src="matchcard.js"></script>
  <script src="consent.js" defer></script>
</body>
</html>
