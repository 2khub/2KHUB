    <button type="button" data-mp="shows">Rosters</button>

  <main class="board" id="board" data-mp="pool">

    <section class="panel pool-panel" id="pool-panel" aria-label="Available superstars">
      <div class="ph"><span class="grow">Available superstars</span><span class="count" id="pool-count">0</span><button type="button" class="link-btn" data-act="custom">+ Custom</button></div>
      <div class="pool-tools">
        <div class="seg" id="view-seg">
          <button type="button" data-act="view" data-v="all" class="on">All</button>

          <button type="button" data-act="view" data-v="woman">Women</button>
          <button type="button" data-act="view" data-v="teams">Teams</button>
        </div>
        <input id="q" class="field" type="search" placeholder="Search..." autocomplete="off" aria-label="Search superstars">
      </div>
      <div id="pool" class="pool" role="list"></div>
    </section>

    <section class="shows" id="shows" aria-label="Show rosters"></section>
  </main>

  <footer class="prompts" id="prompts" role="contentinfo"></footer>

  <!-- corner broadcast box: fast-flipping superstars, then the pick -->
  <div id="tv" class="pip" hidden aria-live="polite">
    <div class="pip-top"><span><i class="live"></i>Live &middot; <span id="tv-title">Draft</span></span><span id="tv-pick">Pick 1</span></div>
    <div class="pip-body">
