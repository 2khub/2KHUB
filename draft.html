<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wrestling Draft Simulator - 2UHub</title>
  <meta name="description" content="Free wrestling draft simulator. Draft Universe Mode rosters across shows, export results, and plan your booking for free.">
  <meta name="theme-color" content="#0a0a14">
  <meta name="keywords" content="Universe Mode, draft tool, wrestling draft, match card generator, wrestling booking simulator, 2UHub">
  <link rel="canonical" href="https://2uhub.com/draft">
  <meta property="og:title" content="Wrestling Draft Simulator - 2UHub">
  <meta property="og:description" content="Draft rosters by show, export drafts, and manage your booking like a GM with this free browser-based draft simulator.">
  <meta property="og:image" content="https://2uhub.com/logos/2uhub-social-preview-1200x630.png">
  <meta property="og:url" content="https://2uhub.com/draft">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="2UHub">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Wrestling Draft Simulator - 2UHub">
  <meta name="twitter:description" content="Free wrestling draft tool. Draft rosters to shows, export results, and track your wrestling universe.">
  <meta name="twitter:image" content="https://2uhub.com/logos/2uhub-social-preview-1200x630.png">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="hardcore.css">
  <link rel="stylesheet" href="draft.css">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "2UHub Wrestling Draft Simulator",
    "applicationCategory": "GameApplication",
    "operatingSystem": "Web Browser",
    "description": "Free wrestling draft simulator. Draft superstars to shows, export to Excel, download draft graphics, and manage fantasy booking rosters.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "url": "https://2uhub.com/draft"
  }
  </script>
</head>
<body class="hc draft-page">

  <header class="hc-header" role="banner">
    <a href="index.html" class="hc-logo" aria-label="2UHub home"><img src="images/px/logo.png" alt="2UHub – Wrestling Draft Tool logo"></a>
    <h1 class="page-title" id="page-title">Draft</h1>
    <div class="hc-header-actions">
      <button type="button" class="btn btn-steel btn-sm" data-act="help" aria-label="How it works">?</button>
      <a class="btn btn-steel btn-sm" href="tools.html">Setup</a>
      <a class="btn btn-steel btn-sm hide-sm" href="matchcard-generator.html">Match cards</a>
    </div>
  </header>

  <div class="guide" id="guide" role="status" aria-live="polite"></div>

  <nav class="mtabs" id="mtabs" aria-label="Panels">
    <button type="button" data-mp="pool" class="on">Superstars</button>
    <button type="button" data-mp="shows">Rosters</button>
  </nav>

  <main class="board" id="board" data-mp="pool">

    <section class="panel pool-panel" id="pool-panel" aria-label="Available superstars">
      <div class="ph"><span class="grow">Available superstars</span><span class="count" id="pool-count">0</span><button type="button" class="link-btn" data-act="custom">+ Custom</button></div>
      <div class="pool-tools">
        <div class="seg" id="view-seg">
          <button type="button" data-act="view" data-v="all" class="on">All</button>
          <button type="button" data-act="view" data-v="man">Men</button>
          <button type="button" data-act="view" data-v="woman">Women</button>
          <button type="button" data-act="view" data-v="teams">Teams</button>
        </div>
        <input id="q" class="field" type="search" placeholder="Search..." autocomplete="off" aria-label="Search superstars">
      </div>
      <div id="pool" class="pool" role="list"></div>
    </section>

    <section class="shows" id="shows" aria-label="Show rosters"></section>
  </main>

  <footer class="prompts" id="prompts" role="contentinfo"></footer>

  <!-- corner broadcast box: fast-flipping superstars, then the pick -->
  <div id="tv" class="pip" hidden aria-live="polite">
    <div class="pip-top"><span><i class="live"></i>Live &middot; <span id="tv-title">Draft</span></span><span id="tv-pick">Pick 1</span></div>
    <div class="pip-body">
      <div class="pip-cards" id="tv-cards"></div>
      <div class="pip-info">
        <div class="pip-k" id="tv-k">Selecting&hellip;</div>
        <div class="pip-name" id="tv-name"></div>
        <div class="pip-lower"><span>Drafted to</span><b id="tv-show"></b></div>
      </div>
    </div>
  </div>
  <div id="draft-export-board" class="xp-board" aria-hidden="true"></div>

  <script src="hardcore.js"></script>
  <script src="tagteams.js"></script>
  <script src="app.js"></script>
  <script src="consent.js" defer></script>
</body>
</html>
