<!DOCTYPE html>
<html lang="en">
<head>
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
      c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
      t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
      y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "wibltdvrqy");
  </script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7224985162462472"
          crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplayer Draft - 2KHUB</title>
  <meta name="description" content="Multiplayer WWE 2K26 & AEW draft simulator. Draft with friends in real-time.">
  <meta name="theme-color" content="#0a0a14">
  <link href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="hardcore.css">
  <link rel="stylesheet" href="multiplayer.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
</head>
<body class="hc enter mp-page">

  <header class="hc-header" role="banner">
    <a href="index.html" class="hc-logo" aria-label="2KHUB home"><img src="images/px/logo.png" alt="2KHUB"></a>
    <nav class="hc-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="tools.html">Draft</a>
      <a href="matchcard-generator.html">Match Cards</a>
      <a href="multiplayer.html" class="on">Multiplayer</a>
    </nav>
    <div class="hc-header-actions">
      <a class="btn btn-support btn-sm" href="https://buymeacoffee.com/2khub" target="_blank" rel="noopener">Support 2KHUB</a>
    </div>
    <h1 class="sr-only">Multiplayer Draft Tool</h1>
  </header>

  <div class="mp-container">

    <!-- 1. start -->
    <div class="screen-state active" id="state-start">
      <div class="mp-card">
        <h2 class="mp-h">Multiplayer draft</h2>
        <button class="btn btn-primary btn-lg mp-wide" id="btn-host">Host a draft</button>
        <div class="mp-or"><span>or</span></div>
        <div class="mp-join">
          <input type="text" id="join-code-input" class="field mp-code-input" placeholder="Room code" maxlength="5" autocomplete="off">
          <button class="btn btn-lg" id="btn-join">Join</button>
        </div>
      </div>
    </div>

    <!-- 2. brand setup -->
    <div class="screen-state" id="state-brand-setup">
      <div class="mp-card">
        <h2 class="mp-h">Your brand</h2>
        <div class="mp-field">
          <label for="setup-brand-name" class="lbl">Name</label>
          <input type="text" id="setup-brand-name" class="field" placeholder="e.g. RAW, SmackDown" maxlength="20">
        </div>

        <div class="mp-field" id="host-roster-select-container" style="display: none;">
          <label class="lbl">Game</label>
          <div class="custom-select" id="mp-roster-custom-select" aria-label="Select roster">
            <div class="select-selected" id="mp-select-selected-roster">Loading...</div>
            <div class="select-items select-hide" id="mp-select-items-roster"></div>
          </div>
          <input type="hidden" id="mp-roster-select" value="wwe2k26">
        </div>

        <div class="mp-field">
          <label for="setup-brand-color" class="lbl">Color</label>
          <div class="mp-color">
            <input type="color" id="setup-brand-color" class="mp-setup-color" value="#c8202d">
            <span class="mp-color-preview" id="color-preview-text">#c8202d</span>
          </div>
        </div>

        <button class="btn btn-primary btn-lg mp-wide" id="btn-enter-lobby">Enter lobby</button>
      </div>
    </div>

    <!-- 3. lobby -->
    <div class="screen-state" id="state-lobby">
      <div class="mp-card">
        <div class="mp-room"><span>Room code</span><b id="room-code">X7B9Q</b></div>
        <h3 class="mp-sub">Players</h3>
        <ul class="mp-player-list" id="player-list">
          <li class="mp-player-item mp-host">Player 1 (Host)</li>
        </ul>
        <div class="mp-actions">
          <button class="btn btn-primary btn-lg" id="btn-start-draft">Start draft</button>
          <button class="btn btn-lg" id="btn-leave-room">Leave</button>
        </div>
      </div>
    </div>

    <!-- 4. draft board -->
    <div class="screen-state" id="state-draft">
      <div class="mp-turn-banner" id="turn-banner">Waiting for game to start...</div>

      <main class="mp-board">
        <section class="brands-wrapper">
          <div class="brands-container" id="mp-brands-area"></div>
        </section>

        <section class="panel roster-pool">
          <div class="ph"><span class="grow">Available superstars</span><span id="roster-count" class="count">0</span></div>
          <div class="pool-tools">
            <input type="text" id="search-input" class="field" placeholder="Search..." autocomplete="off">
          </div>
          <div id="superstar-list" class="cards-grid"></div>
        </section>
      </main>

      <div class="prompts">
        <span class="gap"></span>
        <button class="btn btn-primary mp-host-only" id="btn-simulate-end">Finalize draft</button>
      </div>
    </div>

    <!-- 5. results -->
    <div class="screen-state" id="state-end">
      <div class="mp-end">
        <div class="mp-final-rosters" id="mp-final-rosters"></div>
        <button class="btn btn-lg" id="btn-back-lobby">Back to lobby</button>
      </div>
    </div>

  </div>

  <div id="animation-area" class="pick-box" style="display: none;"></div>
  <div class="mp-draft-backdrop" id="mp-draft-backdrop"></div>
  <div id="site-notifications" class="site-notifications" aria-live="polite"></div>

  <div id="site-modal" class="site-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-box">
      <h3 id="modal-title" class="modal-title"></h3>
      <p class="modal-message"></p>
      <input type="text" class="modal-input field" id="modal-input" placeholder="" style="display: none;">
      <div class="modal-actions">
        <button type="button" class="btn btn-modal btn-modal-cancel">Cancel</button>
        <button type="button" class="btn btn-primary btn-modal btn-modal-ok">OK</button>
      </div>
    </div>
  </div>

  <script src="hardcore.js"></script>
  <script type="module" src="multiplayer.js"></script>
</html>
